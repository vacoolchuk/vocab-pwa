<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vocabulary">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://youglish.com">
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://www.tiktok.com">
<link rel="apple-touch-icon" href="icon-180.png">
<title>My Vocabulary</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&family=Literata:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root{
  --screen:#000;--surface:#17171A;--surface2:#222226;--line:#2B2B30;
  --milk:#F2EDE3;--dim:#8C877D;--faint:#5B5852;--amber:#D4A24C;
  --again:#8E3B3B;--hard:#8A6A2C;--good:#3C6B46;--easy:#3B5A7A;
  --new:#6B675F;--learning:#D4A24C;--review:#7FA0C4;--known:#8DBB8A;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --ui:"Barlow","Helvetica Neue",Arial,sans-serif;
  --book:"Literata",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --nav:60px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--screen);color:var(--milk);font-family:var(--ui);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
#app{height:100%}
.row{display:flex;gap:8px;align-items:center}

/* ---------- feed ---------- */
#feed,#reel{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--screen)}
.tinted{--tint:#1B2A20;background:radial-gradient(130% 75% at 50% -5%,var(--tint) 0%,#0B100D 62%,#050706 100%)}
#feed::-webkit-scrollbar,#reel::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;padding:calc(var(--sat) + 52px) 22px calc(var(--nav) + var(--sab) + 14px);position:relative;overflow:hidden}
.slide .meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:14px;letter-spacing:.04em;color:var(--dim);margin-bottom:10px;position:relative;z-index:2}
.slide .meta .st{color:var(--dim)}
.slide .meta .st.learning{color:var(--learning)}.slide .meta .st.review{color:var(--review)}.slide .meta .st.known{color:var(--known)}
.still{position:absolute;inset:0;z-index:0}
.still img{width:100%;height:100%;object-fit:cover;display:block;opacity:0}
.still img.on{opacity:.55;transition:opacity .4s ease}
.still:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 35%,rgba(0,0,0,.25) 60%,rgba(0,0,0,.92) 100%)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;z-index:1}
.front{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;cursor:pointer;padding-bottom:12vh}
.front .w{font-family:var(--display);font-weight:600;font-size:64px;line-height:.95;letter-spacing:-.01em;margin:0 0 18px;color:var(--milk);text-shadow:0 2px 24px rgba(0,0,0,.6)}
.front.cloze{justify-content:center;padding-bottom:6vh;text-align:left;align-items:stretch}
.cz{font-family:var(--book);font-size:26px;line-height:1.45;color:var(--milk);margin:0 0 22px;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.hintdef{font-family:var(--display);font-size:17px;letter-spacing:.03em;color:var(--amber);margin:0;opacity:.9}
.front.listen{justify-content:center;padding-bottom:8vh}
.bigplay{width:112px;height:112px;border-radius:50%;border:1.5px solid var(--amber);background:rgba(0,0,0,.45);color:var(--amber);padding:0;margin-bottom:26px;display:flex;align-items:center;justify-content:center}
.bigplay .tri{width:44px;height:44px;fill:currentColor;margin-left:6px;pointer-events:none}
.bigplay:active{background:var(--amber);color:#000}
.saybtn{font-family:var(--mono);font-size:15px;color:var(--amber);background:rgba(0,0,0,.55);border:1px solid rgba(212,162,76,.35);border-radius:4px;padding:7px 14px;letter-spacing:.02em}
.saybtn:before{content:"▶\FE0E";font-size:10px;margin-right:9px;vertical-align:1px}
.back{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;cursor:pointer}
.back .w{font-family:var(--display);font-weight:600;font-size:34px;line-height:1;margin:0 10px 0 0}
.back .ipa{font-family:var(--mono);font-size:12px;color:var(--amber)}
.mtabs{display:flex;gap:0;margin:0 0 14px;border-bottom:1px solid var(--line)}
.mtabs button{padding:8px 14px 10px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;color:var(--dim);font-family:var(--display);font-size:16px;letter-spacing:.03em}
.mtabs button.on{color:var(--amber);border-bottom-color:var(--amber)}
.tag{display:inline-block;font-family:var(--display);font-size:13px;letter-spacing:.05em;color:var(--amber);padding:0;margin:8px 0 2px}
.def{margin:8px 0 8px;font-family:var(--book);font-size:19px;font-weight:500;line-height:1.4;color:var(--milk)}
.desc{margin:0 0 16px;font-family:var(--book);font-size:15px;color:var(--dim);line-height:1.6}
.ex{border-top:1px solid var(--line);padding-top:12px}
.ex h4{margin:0 0 10px;font-family:var(--display);font-size:13px;font-weight:500;letter-spacing:.05em;color:var(--faint)}
.ex p{margin:0 0 10px;font-family:var(--book);font-size:15px;color:#C9C3B6;line-height:1.55;padding-left:14px;border-left:2px solid var(--line)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:12px;background:var(--line);border:1px solid var(--line)}
.rate button{padding:15px 4px;border:0;font-family:var(--display);font-size:18px;letter-spacing:.04em;color:var(--milk);background:var(--surface)}
.rate .again{background:var(--again)}.rate .hard{background:var(--hard)}.rate .good{background:var(--good)}.rate .easy{background:var(--easy)}
.rate small{display:none}
.rated{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;background:rgba(5,7,6,.92);font-family:var(--display);font-size:28px;color:var(--amber);letter-spacing:.02em}

/* ---------- story ---------- */
.story{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;justify-content:center}
.story h2{margin:0 0 16px;font-family:var(--display);font-weight:600;font-size:34px;line-height:1;letter-spacing:-.01em}
.story p{margin:0 0 12px;font-family:var(--book);font-size:18px;line-height:1.7;white-space:pre-wrap;color:#E6E0D4}
.story .t{border-radius:2px;padding:0 1px}
.story .t.peeked{background:rgba(212,162,76,.22);color:var(--amber)}
.story .t.inbox{background:rgba(141,187,138,.2);color:var(--known)}
.story .t:active{background:var(--surface2)}
.storyhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}
.storyhead h2{margin:0}
.readbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--amber);font-family:var(--display);font-size:15px;letter-spacing:.04em;flex-shrink:0}
.readbtn .tri{width:11px;height:11px;fill:currentColor;pointer-events:none}
.readbtn .rs{display:none}.readbtn.on .rl{display:none}.readbtn.on .rs{display:inline}.readbtn.on{border-color:var(--amber)}
.sdone{margin-top:12px}
.sdone button{width:100%;padding:14px;border:1px solid var(--amber);background:transparent;color:var(--amber);font-family:var(--display);font-size:18px;letter-spacing:.05em}
.sreveal{font-family:var(--ui);font-size:13px;color:var(--dim);margin:6px 0 0;line-height:1.5}
.sreveal b{color:var(--milk);font-weight:500}

/* ---------- done ---------- */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.done .big{display:none}
.done h2{margin:0 0 8px;font-family:var(--display);font-weight:600;font-size:56px;line-height:.95;letter-spacing:-.01em;color:var(--amber)}
.done p{margin:0 0 4px;color:var(--dim);font-size:15px}
.done .row{display:flex;gap:28px;margin:28px 0}
.done .st{text-align:center}.done .st b{display:block;font-family:var(--display);font-size:36px;font-weight:600;line-height:1}.done .st span{font-size:12px;color:var(--dim)}

/* ---------- news ---------- */
.news{padding:18px 0 22px;border-bottom:1px solid var(--line)}
.news:last-child{border-bottom:0}
.nimg{margin:0 0 14px;background:rgba(255,255,255,.04);aspect-ratio:16/10;overflow:hidden}
.nimg img{width:100%;height:100%;object-fit:cover;display:block;opacity:0}
.nimg img.on{opacity:.9;transition:opacity .4s}
.nimg.press{display:block;position:relative;text-decoration:none}
.nimg.press img{opacity:1}
.credit{position:absolute;right:0;bottom:0;font-family:var(--display);font-size:11px;letter-spacing:.05em;color:var(--milk);background:rgba(0,0,0,.6);padding:3px 8px}
.ncat{font-family:var(--display);font-size:14px;letter-spacing:.05em;color:var(--amber);margin:0 0 6px}
.news h2{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.05;margin:0 0 10px;letter-spacing:-.01em}
.ntext{font-family:var(--book);font-size:17px;line-height:1.65;color:#E6E0D4;margin:0 0 12px}
.ntext .t{border-radius:2px;padding:0 1px}
.ntext .t.inbox{background:rgba(141,187,138,.2);color:var(--known)}
.nsrc{font-family:var(--display);font-size:14px;letter-spacing:.04em;color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line)}

/* back of the card: dim the photo and brighten the text so it reads on any picture */
.slide.flipped .still img.on{opacity:.42}
.slide.flipped .still:after{background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.42) 45%,rgba(0,0,0,.82) 100%)}
.slide.flipped .back{text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 14px rgba(0,0,0,.8)}
.slide.flipped .back .def{color:#FFFBF2}
.slide.flipped .back .desc{color:#E4DED2}
.slide.flipped .back .ex p{color:#EFE9DC;border-left-color:rgba(212,162,76,.45)}
.slide.flipped .back .ex h4{color:#B8B2A4}
.slide.flipped .back .tag{color:#E2B35A}
/* ---------- watch feed (experiment) ---------- */
#reel .slide{padding-top:calc(var(--sat) + 38px);padding-bottom:calc(var(--nav) + var(--sab) + 4px);overflow:hidden}
#reel .body>*{flex-shrink:0}
#reel .wplayer{margin-bottom:0;height:490px}
@media (max-height:760px){#reel .slide{overflow-y:auto;-webkit-overflow-scrolling:touch}}
.rword{font-family:var(--display);font-weight:600;font-size:36px;line-height:1;margin:0 0 4px;color:var(--milk)}
.rdef{font-family:var(--book);font-size:14px;line-height:1.4;color:#E4DED2;margin:0 0 7px;min-height:39px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rhint{font-size:12px;color:var(--faint);text-align:center;margin:8px 0 0;font-family:var(--display);letter-spacing:.1em;text-transform:uppercase}
.wsug{margin:-6px 0 14px;border:1px solid var(--line);background:rgba(0,0,0,.35)}
.wsug button{display:flex;justify-content:space-between;align-items:baseline;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--milk);font-family:var(--display);font-size:22px;padding:11px 12px}
.wsug button:last-child{border-bottom:0}
.wsug button small{font-family:var(--ui);font-size:12px;color:var(--dim)}
.wsug b{color:var(--amber);font-weight:600}
.wmode{display:flex;gap:8px;margin:-6px 0 14px}
.wsw{display:flex;gap:4px}
.wsw span{font-family:var(--display);font-size:16px;letter-spacing:.06em;color:var(--faint);padding:2px 8px;cursor:pointer}
.wsw span.on{color:var(--amber)}
.ttbox{flex:1;min-height:0;background:#000;border:1px solid var(--line);position:relative;overflow:hidden}
.ttbox iframe{display:block;width:100%;height:100%;border:0}
.ttcard{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px;text-align:center}
.tth{margin:0;font-family:var(--display);font-weight:600;font-size:34px;line-height:1.05;color:var(--milk)}
.tts{margin:-6px 0 0;font-size:14px;color:var(--dim)}
.ttopen{display:block;width:100%;padding:16px;background:var(--amber);color:#000;text-decoration:none;font-family:var(--display);font-size:20px;letter-spacing:.05em}
.ttplay{font-size:13px;color:var(--dim);text-decoration:underline}
.ttfail{padding:30px 20px;text-align:center;color:var(--dim);font-size:14px;line-height:1.5}
.ttfail a{display:inline-block;margin-top:14px;padding:12px 20px;border:1px solid var(--amber);color:var(--amber);font-family:var(--display);font-size:18px;letter-spacing:.05em;text-decoration:none}
#reel .rhint a{color:var(--amber);text-decoration:none}
/* ---------- watch tab ---------- */
.wsearch{display:flex;gap:8px;margin-bottom:14px}
.wsearch input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--milk);font-family:var(--display);font-size:24px;padding:8px 2px;outline:none;border-radius:0}
.wsearch button{background:transparent;border:1px solid var(--amber);color:var(--amber);font-family:var(--display);font-size:17px;letter-spacing:.05em;padding:0 16px}
.wplayer{background:#000;border:1px solid var(--line);margin-bottom:6px}
.wplayer{min-height:200px}
.wplayer iframe{max-width:100%}
.ygbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 6px}
.ygbar .wbtn{margin:0;flex:0 0 auto;min-width:124px;padding:10px 16px}
.ygbar .st{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--dim)}
.wbtn{background:transparent;border:1px solid var(--amber);color:var(--amber);font-family:var(--display);font-size:17px;letter-spacing:.05em;padding:6px 16px;margin:0 0 10px}
.wnow{display:flex;align-items:baseline;gap:10px;margin:2px 0 8px}
.wnow b{font-family:var(--display);font-size:26px;font-weight:600}
.wnow span{font-size:12px;color:var(--dim)}
.wfoot{font-size:12px;color:var(--dim);margin:0 0 18px}
.wfoot a{color:var(--amber)}
.wchips{display:flex;flex-wrap:wrap;gap:8px}
.wchips button{background:transparent;border:1px solid var(--line);color:var(--milk);font-family:var(--display);font-size:18px;letter-spacing:.02em;padding:6px 12px}
.wchips button.on{border-color:var(--amber);color:var(--amber)}
.wlabel{font-family:var(--display);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:16px 0 8px}
/* ---------- hear it in the wild ---------- */
.wild{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:9px 14px;border:1px solid var(--amber);background:transparent;color:var(--amber);font-family:var(--display);font-size:16px;letter-spacing:.04em}
.wild .tri{width:12px;height:12px;fill:currentColor;pointer-events:none}
#wild{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--surface);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .22s ease;padding-bottom:var(--sab)}
#wild.show{transform:none}
.wildhead{display:flex;align-items:baseline;gap:10px;padding:14px 18px 10px}
.wildhead b{font-family:var(--display);font-size:24px;font-weight:600}
.wildhead span{font-size:12px;color:var(--dim);flex:1}
.wildhead button{background:transparent;border:0;color:var(--amber);font-family:var(--display);font-size:16px;letter-spacing:.05em;padding:4px 6px}
.wildbody{background:#000;min-height:200px}
.wildfoot{margin:0;padding:10px 18px 12px;font-size:12px;color:var(--dim)}
.wildfoot a{color:var(--amber)}

/* ---------- popup ---------- */
#pop{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:20px 22px calc(var(--sab) + 22px);transform:translateY(110%);transition:transform .22s ease;max-height:70vh;overflow-y:auto}
#pop.show{transform:none}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
#shade.show{display:block}
#pop .w{font-family:var(--display);font-weight:600;font-size:34px;line-height:1;margin:0 0 6px}
#pop .ctx{font-family:var(--book);font-size:14px;color:var(--dim);font-style:italic;margin:10px 0 14px;line-height:1.5}
#pop .gloss{font-family:var(--book);font-size:17px;color:var(--milk);margin:6px 0 18px;line-height:1.5}
#pop .tag{margin:0}
#pop .def{font-size:17px}
#pop .desc{margin-bottom:10px}
#pop .ipa{font-family:var(--mono);font-size:13px;color:var(--amber)}

/* ---------- nav ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--sab));padding-bottom:var(--sab);display:flex;background:var(--screen);border-top:1px solid var(--line);z-index:30}
#nav button{flex:1;border:0;background:transparent;color:var(--faint);font-family:var(--display);font-size:17px;letter-spacing:.05em;position:relative}
#nav button span{display:none}
#nav button.on{color:var(--amber)}
#nav button.on:before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--amber)}
#nav button i{position:absolute;top:10px;right:22%;background:var(--amber);color:#000;font-style:normal;font-family:var(--ui);font-size:10px;font-weight:700;border-radius:99px;padding:1px 5px}

/* ---------- pages ---------- */
.page{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 52px) 18px calc(var(--nav) + var(--sab) + 24px)}
.title{margin:0 0 18px;font-family:var(--display);font-weight:600;font-size:40px;line-height:1;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
.title small{margin-left:auto;font-size:15px;color:var(--dim);font-weight:400;letter-spacing:.04em}
.list{border-top:1px solid var(--line)}
.lr{display:grid;grid-template-columns:1.5fr 1.5fr auto;padding:14px 0 14px 14px;align-items:center;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.lr:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--new)}
.lr.learning:before{background:var(--learning)}.lr.review:before{background:var(--review)}.lr.known:before{background:var(--known)}
.lr b{font-family:var(--display);font-size:22px;font-weight:500;line-height:1}
.lr .ipa{font-family:var(--mono);font-size:12px;color:var(--amber)}
.badge{font-family:var(--display);font-size:14px;letter-spacing:.05em;color:var(--dim);cursor:pointer;padding:4px 0 4px 10px}
.badge.learning{color:var(--learning)}.badge.review{color:var(--review)}.badge.known{color:var(--known)}
.detail{padding:12px 0 18px 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.04)}
.detail .def{font-size:16px}.detail .desc{font-size:14px}.detail .ex p{font-size:14px}
.box{background:rgba(255,255,255,.04);padding:18px;margin-bottom:10px;border:1px solid var(--line)}
.box h3{margin:0 0 6px;font-family:var(--display);font-size:20px;font-weight:500;letter-spacing:.02em}
.box p{margin:0 0 12px;font-size:14px;color:var(--dim);line-height:1.5}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-bottom:10px;background:var(--line);border:1px solid var(--line)}
.stats4 .box{padding:14px 6px;text-align:center;margin:0;border:0}
.stats4 b{display:block;font-family:var(--display);font-size:32px;font-weight:600;line-height:1}.stats4 span{font-family:var(--display);font-size:13px;letter-spacing:.05em;color:var(--dim)}
.bar{height:3px;background:var(--line);margin-top:12px}
.bar i{display:block;height:100%;background:var(--known)}
.btn{width:100%;padding:13px;border:1px solid var(--amber);margin-bottom:8px;background:var(--amber);color:#000;font-family:var(--display);font-size:18px;letter-spacing:.05em}
.btn.g{background:var(--amber);color:#000}
.btn.o{background:transparent;color:var(--amber)}
.btn.sm{width:auto;padding:9px 16px;margin:0;font-size:15px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);font-size:14px;background:var(--screen);color:var(--milk);font-family:inherit;border-radius:0;-webkit-appearance:none}
.catchbar input{font-family:var(--display);font-size:24px;padding:12px 14px;border:1px solid var(--amber);background:rgba(0,0,0,.35);color:var(--milk);-webkit-appearance:none;border-radius:0}

.cword{margin-top:14px;padding:16px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.cword b{font-family:var(--display);font-size:36px;font-weight:600;line-height:1}

@media (prefers-reduced-motion:reduce){*{transition:none !important}}

<body>
<div id="app"><p class="empty">Loading…</p></div>
<div id="shade"></div><div id="pop"></div><div id="wild"></div>
<nav id="nav">
  <button data-nav="feed" class="on"><span>▲</span>Today</button>
  <button data-nav="catch"><span>+</span>Catch</button>
  <button data-nav="news"><span>≡</span>News</button>
  <button data-nav="watch"><span>▶</span>Watch</button>
  <button data-nav="list"><span>≡</span>Words</button>
  <button data-nav="stats"><span>◔</span>Stats</button>
</nav>

<script>
"use strict";
const APP_VERSION = "2026.10.24-51";
const KEY = "wsv.progress.v4";
const KEY_V3 = "wsv.progress.v3";
const LEGACY_KEYS = ["vocabstatus2","vocabstatus","vocab_status","vocabProgress","vocab-progress"];
const NEW_PER_DAY = 10, STORY_EVERY = 4, MAX_STORIES = 3, KNOWN_IVL = 30, MAX_IVL = 120;

let WORDS = [], STORIES = [], BY = {}, NEWS = null, NEWS_BY = {}, VIDEOS = [];
let P = null;                 // progress
let feed = [];                // slides for today
let slideState = {};          // per slide: flipped, defIdx, rated, peeked, inboxed
let view = "feed";
let ui = { open: null, openDef: 0, msg: "", banner: "", bannerWarn: false, shownCode: "" };

/* ================= storage ================= */
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); return true; } catch(e){ return false; } };
function idbOpen(){ return new Promise((res,rej) => { if (!window.indexedDB) return rej(); const r = indexedDB.open("wsv",1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ try { const db = await idbOpen(); return await new Promise(res => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch(e){ return null; } }
async function idbSet(k,v){ try { const db = await idbOpen(); await new Promise(res => { const tx = db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete = res; tx.onerror = res; }); } catch(e){} }

const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const addDays = (key, n) => { const [y,m,d] = key.split("-").map(Number); const t = new Date(y, m-1, d + n); return t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0") + "-" + String(t.getDate()).padStart(2,"0"); };
const dayDiff = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);

function emptyP(){ return { v: 4, cards: {}, inbox: [], days: {}, stories: {}, lastBackup: 0, newToday: {} }; }
function newCard(){ return { ivl: 0, ease: 2.5, due: today(), reps: 0, lapses: 0 }; }
function knownCard(spread){ const c = newCard(); c.ivl = KNOWN_IVL; c.reps = 3; c.due = addDays(today(), spread ? Math.floor(Math.random()*21) : KNOWN_IVL); return c; }

// legacy: v3 JSON {known:[]}, "a:known,b:learning", "a|b|c"
function legacyKnown(raw){
  const out = new Set(); if (!raw) return out; raw = String(raw).trim();
  try { const j = JSON.parse(raw); if (Array.isArray(j)) j.forEach(w => out.add(w)); else if (j && Array.isArray(j.known)) j.known.forEach(w => out.add(w)); else if (j && typeof j === "object" && !j.cards) Object.entries(j).forEach(([w,s]) => { if (s === "known") out.add(w); }); return out; } catch(e){}
  if (raw.includes(":")) raw.split(",").forEach(p => { const [w,s] = p.split(":"); if (w && s && s.trim() === "known") out.add(w.trim()); });
  else raw.split("|").forEach(w => { if (w.trim()) out.add(w.trim()); });
  return out;
}
function mergeP(a, b){
  if (!b) return a;
  Object.entries(b.cards || {}).forEach(([w,c]) => { const x = a.cards[w]; if (!x || (c.reps||0) > (x.reps||0) || ((c.reps||0) === (x.reps||0) && c.due > x.due)) a.cards[w] = c; });
  (b.inbox || []).forEach(i => { if (!a.inbox.some(x => x.word === i.word)) a.inbox.push(i); });
  a.trash = a.trash || []; (b.trash || []).forEach(i => { if (!a.trash.some(x => x.word === i.word) && !a.inbox.some(x => x.word === i.word)) a.trash.push(i); });
  Object.entries(b.days || {}).forEach(([k,n]) => { a.days[k] = Math.max(a.days[k] || 0, n); });
  Object.entries(b.stories || {}).forEach(([k,t]) => { a.stories[k] = Math.max(a.stories[k] || 0, t); });
  a.lastBackup = Math.max(a.lastBackup || 0, b.lastBackup || 0);
  return a;
}
async function loadP(){
  let p = emptyP();
  const parse = r => { try { const j = JSON.parse(r); return j && j.v === 4 ? j : null; } catch(e){ return null; } };
  p = mergeP(p, parse(lsGet(KEY)));
  p = mergeP(p, parse(await idbGet(KEY)));
  // migrate: anything older only ever adds "known"
  const known = new Set();
  legacyKnown(lsGet(KEY_V3)).forEach(w => known.add(w));
  legacyKnown(await idbGet(KEY_V3)).forEach(w => known.add(w));
  LEGACY_KEYS.forEach(k => legacyKnown(lsGet(k)).forEach(w => known.add(w)));
  known.forEach(w => { if (!p.cards[w]) p.cards[w] = knownCard(true); });
  // clamp anything that ran away during testing
  Object.values(p.cards).forEach(c => { if (c.ivl > MAX_IVL){ c.ivl = MAX_IVL; c.due = addDays(today(), MAX_IVL); } if (c.ease > 3) c.ease = 3; });
  P = p;
  await saveP();
}
async function saveP(){ const s = JSON.stringify(P); lsSet(KEY, s); await idbSet(KEY, s); }

/* ================= SRS ================= */
const card = w => P.cards[w];
function status(w){ const c = card(w); if (!c || c.reps === 0) return "new"; if (c.ivl < 7) return "learning"; if (c.ivl < KNOWN_IVL) return "review"; return "known"; }
function rate(w, g){
  const c = P.cards[w] || (P.cards[w] = newCard());
  const t = today();
  const ratedToday = c.lastDay === t && c.reps > 0;   // a second rating on the same day must not compound the interval
  if (g === "again"){ c.lapses++; c.ivl = 0; c.ease = Math.max(1.3, c.ease - 0.2); c.due = t; }
  else if (g === "hard"){ if (!ratedToday) c.ivl = c.ivl < 1 ? 1 : Math.ceil(c.ivl * 1.2); c.ease = Math.max(1.3, c.ease - 0.15); c.due = addDays(t, Math.max(1, c.ivl)); }
  else if (g === "good"){ if (!ratedToday) c.ivl = c.ivl < 1 ? 1 : c.ivl < 3 ? 3 : Math.ceil(c.ivl * c.ease); c.due = addDays(t, Math.max(1, c.ivl)); }
  else { if (!ratedToday){ c.ivl = c.ivl < 1 ? 3 : Math.ceil(c.ivl * c.ease * 1.3); c.ease = Math.min(3, c.ease + 0.15); } c.due = addDays(t, Math.max(1, c.ivl)); }
  if (c.ivl > MAX_IVL){ c.ivl = MAX_IVL; c.due = addDays(t, MAX_IVL); }
  c.reps++; c.last = Date.now(); c.lastDay = t;
  P.days[t] = (P.days[t] || 0) + 1;
  saveP();
}
function peek(w){ const c = P.cards[w] || (P.cards[w] = newCard()); if (c.reps > 0){ c.ivl = Math.max(1, Math.floor(c.ivl / 2)); c.due = addDays(today(), 1); } saveP(); }
function reinforce(w){ const c = P.cards[w]; if (!c || c.reps === 0 || c.ivl < 1) return; c.ivl = Math.ceil(c.ivl * 1.15); c.due = addDays(today(), c.ivl); }
function streak(){ let n = 0, d = today(); if (!P.days[d]) d = addDays(d, -1); while (P.days[d]){ n++; d = addDays(d, -1); } return n; }
function dueCount(dayKey){ return WORDS.filter(w => { const c = card(w.word); return c && c.reps > 0 && c.due <= dayKey; }).length; }

/* ================= feed ================= */
function shuffle(a){ a = [...a]; for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function buildFeed(ahead){
  const t = today();
  let cards;
  if (ahead){
    cards = shuffle(WORDS).slice(0, 10);
  } else {
    const due = WORDS.filter(w => { const c = card(w.word); return c && c.reps > 0 && c.due <= t; }).sort((a,b) => card(a.word).due.localeCompare(card(b.word).due));
    const introduced = P.newToday[t] || [];
    const fresh = WORDS.filter(w => status(w.word) === "new" && !introduced.includes(w.word)).slice(0, Math.max(0, NEW_PER_DAY - introduced.length));
    const introducedWords = WORDS.filter(w => introduced.includes(w.word) && status(w.word) === "new");
    cards = shuffle([...due, ...fresh, ...introducedWords]);
    P.newToday = { [t]: [...introduced, ...fresh.map(w => w.word)] };
    saveP();
  }
  // stories: prefer ones whose words sit in the "gap" (ivl >= 7) and not read in the last 5 days
  const score = s => s.words.reduce((n,w) => { const c = card(w); return n + (c && c.reps > 0 && c.ivl >= 7 ? 1 : 0); }, 0);
  const recent = s => (P.stories[s.id] || 0) > Date.now() - 5*864e5;
  let pool = STORIES.filter(s => !recent(s)).sort((a,b) => score(b) - score(a) || (P.stories[a.id]||0) - (P.stories[b.id]||0));
  if (!pool.length && cards.length) pool = [...STORIES].sort((a,b) => (P.stories[a.id]||0) - (P.stories[b.id]||0));
  const stories = pool.slice(0, cards.length ? Math.min(MAX_STORIES, Math.max(1, Math.floor(cards.length / STORY_EVERY))) : 0);
  feed = []; slideState = {};
  cards.forEach((w,i) => { feed.push({ type: "word", w }); if ((i+1) % STORY_EVERY === 0 && stories.length) feed.push({ type: "story", s: stories.shift() }); });
  stories.forEach(s => feed.push({ type: "story", s }));
  feed.push({ type: "done" });
  feed.forEach((f,i) => slideState[i] = { flipped: false, defIdx: 0, rated: "", peeked: [], inboxed: [], mode: f.type === "word" ? pickMode(f.w) : "see" });
}

/* ================= helpers ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* voices: prefer the best British voice installed on the phone; the user can pick one in Stats */
function ukVoices(){ return (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(v => /en[-_]GB/i.test(v.lang)); }
function voiceKind(v){ const u = ((v.voiceURI || "") + " " + v.name).toLowerCase(); return /premium/.test(u) ? "premium" : /enhanced/.test(u) ? "enhanced" : /compact/.test(u) ? "compact" : ""; }
function voiceRank(v){ const k = voiceKind(v); return (k === "premium" ? 300 : k === "enhanced" ? 200 : k === "compact" ? 90 : 100) + (/siri/i.test(v.name) ? 50 : 0) + (v.localService ? 10 : 0); }
function voiceLabel(v){ const k = voiceKind(v); return v.name.replace(/\s*\(en-GB\)$/i, "") + (k ? " · " + k : ""); }
function bestVoice(){
  const vs = ukVoices(); if (!vs.length) return null;
  const want = lsGet("wsv.voice"); const chosen = want && vs.find(v => (v.voiceURI || v.name) === want); if (chosen) return chosen;
  return [...vs].sort((a,b) => voiceRank(b) - voiceRank(a))[0];
}
/* instant word audio: decoded into memory ahead of time, played through Web Audio */
let actx = null, wordPlayer = null; const BUF = {}, BUFP = {};
function audioKey(text){ return "word:" + String(text).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
function ctx(){ if (!actx){ const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); } return actx; }
async function warmWord(text){
  const entry = AUDIO[audioKey(text)]; if (!entry || !entry.file || BUF[text] || !ctx()) return;
  if (BUFP[text]) return BUFP[text];
  BUFP[text] = (async () => { try { const r = await fetch("audio/" + entry.file); const ab = await r.arrayBuffer(); BUF[text] = await ctx().decodeAudioData(ab); } catch(e){} })();
  return BUFP[text];
}
function speak(text){
  stopReading();
  const c = ctx(); if (c && c.state === "suspended") c.resume();
  if (BUF[text] && c){ const src = c.createBufferSource(); src.buffer = BUF[text]; src.connect(c.destination); src.start(0); return; }
  const entry = AUDIO[audioKey(text)];
  if (entry && entry.file){ if (wordPlayer){ try { wordPlayer.pause(); } catch(e){} } wordPlayer = new Audio("audio/" + entry.file); wordPlayer.play().catch(() => speakSystem(text)); warmWord(text); return; }
  speakSystem(text);
}
// stories and news: keep a preloaded player per item so Listen starts at once
const PRE = {};
function preloadLong(id){ const e = AUDIO[id]; if (!e || !e.file || PRE[id]) return; const a = new Audio("audio/" + e.file); a.preload = "auto"; PRE[id] = a; }
function speakSystem(text){ if (!window.speechSynthesis) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "en-GB"; u.rate = .9; const v = bestVoice(); if (v) u.voice = v; speechSynthesis.speak(u); }
/* read a whole story or news item aloud: a pre-generated British neural voice when the mp3 exists, else the phone's voice */
let readingId = null, AUDIO = {}, player = null;
function readAloud(id, text){
  if (readingId === id){ stopReading(); return; }
  stopReading(); readingId = id;
  const key = id.replace(":", ":"); const entry = AUDIO[key];
  if (entry && entry.file){
    player = PRE[key] || new Audio("audio/" + entry.file); PRE[key] = null; player.preload = "auto"; try { player.currentTime = 0; } catch(e){}
    player.onended = () => { if (readingId === id) stopReading(); };
    player.onerror = () => { if (readingId === id){ player = null; speakFallback(id, text); } };
    player.play().catch(() => { if (readingId === id){ player = null; speakFallback(id, text); } });
    document.querySelectorAll('[data-act="read"]').forEach(b => b.classList.toggle("on", b.dataset.id === id));
    return;
  }
  speakFallback(id, text);
}
function speakFallback(id, text){
  if (!window.speechSynthesis) return;
  const clean = text.replace(/\{\{([^|]+)\|[^}]+\}\}/g, "$1").replace(/\s+/g, " ").trim();
  const parts = clean.match(/[^.!?]+[.!?]+["”']?|[^.!?]+$/g) || [clean];
  const v = bestVoice();
  parts.forEach((pt, k) => { const u = new SpeechSynthesisUtterance(pt.trim()); u.lang = "en-GB"; u.rate = .92; if (v) u.voice = v; if (k === parts.length - 1) u.onend = () => { if (readingId === id) stopReading(); }; speechSynthesis.speak(u); });
  document.querySelectorAll('[data-act="read"]').forEach(b => b.classList.toggle("on", b.dataset.id === id));
}
function stopReading(){ if (player){ try { player.pause(); player.currentTime = 0; } catch(e){} if (readingId) PRE[readingId] = player; player = null; } if (window.speechSynthesis) speechSynthesis.cancel(); readingId = null; document.querySelectorAll('[data-act="read"].on').forEach(b => b.classList.remove("on")); }
function readBtn(id){ return '<button class="readbtn" data-act="read" data-id="' + esc(id) + '"><svg class="tri" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg><span class="rl">Listen</span><span class="rs">Stop</span></button>'; }
function say(m, err){ ui.msg = m; ui.msgErr = !!err; render(); setTimeout(() => { ui.msg = ""; render(); }, 3500); }
function examplesHTML(d, cls){ return '<div class="ex"><h4>Examples</h4>' + d.examples.map(e => "<p>" + esc(e) + "</p>").join("") + "</div>"; }

/* images: free CC photos (Openverse, then Wikimedia Commons). Several candidates per word,
   the first that actually loads is cached. Failures are retried after a day. */
const imgCache = {};
async function imageCandidates(w){
  if (w.image) return [w.image];
  if (!w.imgQuery) return [];
  const k = "wsv.img." + w.word;
  try { const c = JSON.parse(lsGet(k) || "null"); if (c && c.ok) return [c.ok]; if (c && c.none && Date.now() - c.none < 864e5) return []; } catch(e){}
  if (imgCache[w.word]) return imgCache[w.word];
  imgCache[w.word] = (async () => {
    const out = [];
    try {
      const r = await fetch("https://api.openverse.org/v1/images/?q=" + encodeURIComponent(w.imgQuery) + "&page_size=8&mature=false&license_type=commercial&extension=jpg,png", { headers: { Accept: "application/json" } });
      const j = await r.json();
      (j.results || []).forEach(x => { if (x.thumbnail) out.push(x.thumbnail); else if (x.url) out.push(x.url); });
    } catch(e){}
    try {
      const r = await fetch("https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=" + encodeURIComponent("filetype:bitmap " + w.imgQuery) + "&gsrnamespace=6&gsrlimit=4&prop=imageinfo&iiprop=url&iiurlwidth=640&format=json&origin=*");
      const j = await r.json();
      Object.values((j.query || {}).pages || {}).forEach(pg => { if (pg.imageinfo && pg.imageinfo[0].thumburl) out.push(pg.imageinfo[0].thumburl); });
    } catch(e){}
    if (!out.length) lsSet(k, JSON.stringify({ none: Date.now() }));
    return out.slice(0, 6);
  })();
  return imgCache[w.word];
}
function loadInto(img, w, urls, i){
  if (!img.isConnected) return;
  if (i >= urls.length){ lsSet("wsv.img." + w.word, JSON.stringify({ none: Date.now() })); img.remove(); return; }
  img.onerror = () => loadInto(img, w, urls, i + 1);
  img.onload = () => { lsSet("wsv.img." + w.word, JSON.stringify({ ok: urls[i] })); img.classList.add("on"); };
  img.referrerPolicy = "no-referrer"; img.src = urls[i];
}
async function getImage(w){ const c = await imageCandidates(w); return c[0] || null; }
function prefetchAudio(){
  feed.forEach(f => { if (f.type === "word") warmWord(f.w.word); else if (f.type === "story") preloadLong("story:" + f.s.id); });
  if (NEWS) NEWS.items.forEach(n => preloadLong("news:" + n.id));
}
function prefetchImages(){
  // warm the cache for today's words so cards show photos the moment they appear
  const words = feed.filter(f => f.type === "word").map(f => f.w).filter(w => w.imgQuery || w.image);
  words.forEach(async w => { const urls = await imageCandidates(w); if (urls.length){ const im = new Image(); loadInto(im, w, urls, 0); } });
}

/* ================= card modes: see / cloze / listen ================= */
function wordRegex(word){
  const parts = word.trim().split(/\s+/).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (parts.length > 1){ const forms = Object.keys(IRREGULAR).filter(k => IRREGULAR[k] === parts[0]); const base = parts[0].length > 4 ? parts[0].replace(/e$/, "") : parts[0]; parts[0] = "(?:" + [base + "[a-z]*", ...forms].join("|") + ")"; }
  const last = parts[parts.length - 1]; const stem = last.length > 4 ? last.replace(/e$/, "") : last;
  parts[parts.length - 1] = stem + "[a-z]*";
  return new RegExp("\\b" + parts.join("\\s+"), "i");
}
function clozeFor(w, defIdx){
  const re = wordRegex(w.word);
  const order = [defIdx, ...w.definitions.map((_, k) => k).filter(k => k !== defIdx)];
  for (const k of order){ for (const ex of w.definitions[k].examples){ const m = ex.match(re); if (m) return { text: ex.replace(m[0], "____"), k }; } }
  return null;
}
function pickMode(w){
  const c = card(w.word); if (!c || c.reps < 1) return "see";
  let h = 0; for (const ch of w.word) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const m = ["see", "cloze", "listen"][(h + c.reps) % 3];

async function dictEntry(word){

      if (r.ok){ const j = await r.json(); const e = j[0]; if (e){ const ph = (e.phonetics || []).map(p => p.text).find(Boolean) || e.phonetic || ""; const defs = []; (e.meanings || []).forEach(m => { (m.definitions || []).slice(0, 2).forEach(d => defs.push({ pos: m.partOfSpeech || "", text: d.definition })); }); if (defs.length) return { ipa: ph.replace(/^\/|\/$/g, "") || await wikiIPA(w), defs: defs.slice(0, 4) }; } }
    } catch(e){}

      const r = await fetch("https://en.wiktionary.org/api/rest_v1/page/definition/" + encodeURIComponent(w) + "?redirect=true", { headers: { Accept: "application/json" } }); reached = true;
      if (r.ok){ const j = await r.json(); const defs = []; (j.en || []).forEach(m => { (m.definitions || []).filter(d => strip(d.definition)).slice(0, 2).forEach(d => defs.push({ pos: (m.partOfSpeech || "").toLowerCase(), text: strip(d.definition) })); }); if (defs.length) return { ipa: await wikiIPA(w), defs: defs.slice(0, 4) }; }
    } catch(e){}

}
// British IPA from the Wiktionary page source: prefers the RP/UK line, falls back to the first English one
async function wikiIPA(word){
  try {
    const r = await fetch("https://en.wiktionary.org/w/api.php?action=parse&prop=wikitext&format=json&origin=*&page=" + encodeURIComponent(word));
    if (!r.ok) return ""; const j = await r.json(); let t = j.parse && j.parse.wikitext && j.parse.wikitext["*"]; if (!t) return "";
    const en = t.indexOf("==English=="); if (en >= 0){ const rest = t.slice(en + 12); const m = rest.match(/\n==[^=]/); t = m ? rest.slice(0, m.index) : rest; }
    const all = [...t.matchAll(/\{\{IPA\|en\|([^}]+)\}\}/g)].map(m => m[1]);

    if (!pick) return "";

  } catch(e){ return ""; }
}
async function ukGloss(word){
  try { const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(word) + "&langpair=en|uk"); if (!r.ok) return ""; const j = await r.json(); const t = j.responseData && j.responseData.translatedText; return t && t.toLowerCase() !== word.toLowerCase() && !/MYMEMORY WARNING/i.test(t) ? t : ""; } catch(e){ return ""; }
}

async function ygShow(id, word){

/* short definition for any tapped word: my own gloss from the story first, then a free dictionary */
const glossCache = {};
/* phrasal verbs and multi-word expressions */
const PARTICLES = new Set(["up","out","on","off","in","down","away","back","over","through","with","for","into","about","after","along","around","round","across","by","to","at","of","forward","ahead","apart","aside"]);
function neighbours(el){
  // words before and after the tapped span, in reading order (same text block)
  const all = [...el.parentElement.querySelectorAll("[data-word],[data-head]")]; const k = all.indexOf(el);
  const w = n => { const e = all[n]; return e ? (e.dataset.word || e.dataset.head || "").toLowerCase() : ""; };
  return { p2: w(k-2), p1: w(k-1), n1: w(k+1), n2: w(k+2) };
}
function sameStem(a, b){ if (!a || !b) return false; a = a.toLowerCase(); b = b.toLowerCase(); return a === b || stems(a).includes(b) || stems(b).includes(a); }
function glossedPhraseAt(word, nb, src){
  const g = (src && src.gloss) || {}; const seq = [nb.p2, nb.p1, word, nb.n1, nb.n2];
  for (const key of Object.keys(g).filter(k => k.includes(" ")).sort((a,b) => b.length - a.length)){
    const parts = key.toLowerCase().split(/\s+/); const idx = parts.findIndex(x => sameStem(x, word)); if (idx < 0) continue;
    const start = 2 - idx; let ok = true;
    for (let j = 0; j < parts.length; j++){ const tok = seq[start + j]; if (!tok || !(sameStem(parts[j], tok) || parts[j].replace(/'s$/, "") === tok)) { ok = false; break; } }

  }
  return null;
}
async function phraseLookup(word, nb){
  // candidate phrasal verbs around the tapped word, longest first; only tried when a particle is involved
  const cands = [];
  if (PARTICLES.has(nb.n1) && PARTICLES.has(nb.n2)) cands.push([word, nb.n1, nb.n2]);
  if (PARTICLES.has(nb.n1)) cands.push([word, nb.n1]);
  if (PARTICLES.has(word) && nb.p1){ if (PARTICLES.has(nb.n1)) cands.push([nb.p1, word, nb.n1]); if (PARTICLES.has(nb.p1) && nb.p2) cands.push([nb.p2, nb.p1, word]); cands.push([nb.p1, word]); }
  for (const c of cands){
    const heads = stems(c[0]).filter(x => x.length > 2);
    for (const h of heads.slice(0, 3)){
      const phrase = [h, ...c.slice(1)].join(" ");
      try {
        const r = await fetch("https://en.wiktionary.org/api/rest_v1/page/definition/" + encodeURIComponent(phrase.replace(/ /g, "_")) + "?redirect=true", { headers: { Accept: "application/json" } });
        if (!r.ok) continue; const j = await r.json(); const m = j.en && j.en[0]; const d = m && m.definitions && m.definitions.find(x => String(x.definition).replace(/<[^>]+>/g, "").trim());
        if (d){
          let def = String(d.definition).replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim(), ph = phrase;
          const form = def.match(/^(?:plural|past participle|simple past|past tense|present participle|third-person singular[^ ]*|alternative (?:form|spelling)|inflection)[a-z ,-]* of (.+)$/i);
          if (form){ // "simple past of call out": fetch the base phrase
            const base = form[1].trim().replace(/[."]+$/, "");
            try { const r2 = await fetch("https://en.wiktionary.org/api/rest_v1/page/definition/" + encodeURIComponent(base.replace(/ /g, "_")) + "?redirect=true", { headers: { Accept: "application/json" } }); if (r2.ok){ const j2 = await r2.json(); const m2 = j2.en && j2.en[0]; const d2 = m2 && m2.definitions && m2.definitions.find(x => String(x.definition).replace(/<[^>]+>/g, "").trim()); if (d2){ ph = base; def = String(d2.definition).replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim(); } } } catch(e){}
          }
          return { phrase: ph, def: (m.partOfSpeech ? m.partOfSpeech.toLowerCase() + " · " : "") + def };
        }

    }
  }

}
function phraseGloss(word, story){
  const g = (story && story.gloss) || {};
  if (g[word]) return g[word];
  const hit = Object.keys(g).find(k => k.includes(" ") && k.split(" ").includes(word)); // part of a glossed phrase
  return hit ? hit + ": " + g[hit] : null;
}
const IRREGULAR = {"broke":"break","broken":"break","came":"come","went":"go","gone":"go","took":"take","taken":"take","gave":"give","given":"give","got":"get","gotten":"get","ran":"run","saw":"see","seen":"see","made":"make","found":"find","brought":"bring","thought":"think","caught":"catch","fell":"fall","fallen":"fall","held":"hold","kept":"keep","left":"leave","lost":"lose","met":"meet","paid":"pay","said":"say","sat":"sit","sold":"sell","sent":"send","shook":"shake","shaken":"shake","spoke":"speak","spoken":"speak","stood":"stand","stuck":"stick","struck":"strike","swept":"sweep","told":"tell","threw":"throw","thrown":"throw","woke":"wake","woken":"wake","wore":"wear","worn":"wear","won":"win","wrote":"write","written":"write","drove":"drive","driven":"drive","ate":"eat","eaten":"eat","drank":"drink","drunk":"drink","began":"begin","begun":"begin","blew":"blow","blown":"blow","built":"build","bought":"buy","chose":"choose","chosen":"choose","did":"do","done":"do","drew":"draw","drawn":"draw","flew":"fly","flown":"fly","forgot":"forget","forgotten":"forget","froze":"freeze","frozen":"freeze","grew":"grow","grown":"grow","hid":"hide","hidden":"hide","hung":"hang","knew":"know","known":"know","laid":"lay","led":"lead","rode":"ride","ridden":"ride","rose":"rise","risen":"rise","sang":"sing","sung":"sing","sank":"sink","sunk":"sink","slept":"sleep","spent":"spend","stole":"steal","stolen":"steal","swam":"swim","swum":"swim","taught":"teach","tore":"tear","torn":"tear","understood":"understand","fed":"feed","fought":"fight","bent":"bend","bit":"bite","bitten":"bite","beaten":"beat","became":"become","felt":"feel","dealt":"deal","meant":"mean","dreamt":"dream","leapt":"leap","lent":"lend","lit":"light","shot":"shoot","sought":"seek","spun":"spin","sprang":"spring","sprung":"spring","stung":"sting","stank":"stink","strode":"stride","swore":"swear","sworn":"swear","wept":"weep","wound":"wind","withdrew":"withdraw","withdrawn":"withdraw","arose":"arise","arisen":"arise","awoke":"awake","bore":"bear","borne":"bear","bred":"breed","clung":"cling","crept":"creep","dug":"dig","fled":"flee","flung":"fling","forbade":"forbid","forgave":"forgive","forgiven":"forgive","ground":"grind","hurt":"hurt","knelt":"kneel","lain":"lie","lay":"lie","mistook":"mistake","overcame":"overcome","overtook":"overtake","shone":"shine","shrank":"shrink","shrunk":"shrink","slid":"slide","sped":"speed","spat":"spit","split":"split","spread":"spread","swung":"swing","trod":"tread","undertook":"undertake","upset":"upset","wrung":"wring","had":"have","has":"have","was":"be","were":"be","been":"be","is":"be","are":"be","am":"be"};
function lemma(w){ w = String(w).toLowerCase(); return IRREGULAR[w] || w; }
function stems(w){
  const out = [w]; if (IRREGULAR[w]) out.push(IRREGULAR[w]);
  if (w.endsWith("ies")) out.push(w.slice(0,-3) + "y");
  if (w.endsWith("es")) out.push(w.slice(0,-2));
  if (w.endsWith("s")) out.push(w.slice(0,-1));
  if (w.endsWith("ed")) out.push(w.slice(0,-2), w.slice(0,-1), w.slice(0,-3));
  if (w.endsWith("ing")) out.push(w.slice(0,-3), w.slice(0,-3) + "e", w.slice(0,-4));
  if (w.endsWith("ly")) out.push(w.slice(0,-2));
  if (w.endsWith("er") || w.endsWith("est")) out.push(w.replace(/(er|est)$/, ""));
  return [...new Set(out.filter(x => x.length > 2))];
}
async function lookup(word, story, depth = 0){
  const own = phraseGloss(word, story); if (own) return own;
  if (glossCache[word] !== undefined) return glossCache[word];
  let result = null, reached = false;
  const strip = h => String(h).replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
  for (const s of stems(word)){
    // 1. Free Dictionary API
    try {
      const r = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(s));
      reached = true;
      if (r.ok){ const j = await r.json(); const m = j[0] && j[0].meanings && j[0].meanings[0]; const d = m && m.definitions && m.definitions[0]; if (d){ result = (m.partOfSpeech ? m.partOfSpeech + " · " : "") + d.definition; break; } }
    } catch(e){}
    // 2. Wiktionary
    try {
      const r = await fetch("https://en.wiktionary.org/api/rest_v1/page/definition/" + encodeURIComponent(s) + "?redirect=true", { headers: { Accept: "application/json" } });
      reached = true;
      if (r.ok){ const j = await r.json(); const m = j.en && j.en[0]; const d = m && m.definitions && m.definitions.find(x => strip(x.definition)); if (d){ result = (m.partOfSpeech ? m.partOfSpeech.toLowerCase() + " · " : "") + strip(d.definition); break; } }
    } catch(e){}
  }
  if (!result && !reached) return null; // offline: do not cache
  // "plural of resident", "simple past of agree": follow to the base word once
  const form = result && result.match(/^(?:[a-z ]+ · )?(?:plural|past participle|simple past|past tense|present participle|third-person singular[^ ]*|comparative|superlative|alternative (?:form|spelling)|inflection)[a-z ,-]* of (?:the verb |the adjective |the noun )?["“]?([A-Za-z-]+)/i);
  if (form && form[1] && form[1].toLowerCase() !== word && depth < 1){ const base = await lookup(form[1].toLowerCase(), story, depth + 1); if (base) result = base; }
  glossCache[word] = result || ""; return result || "";
}
function sentenceAround(text, word){
  const clean = text.replace(/\{\{([^|]+)\|[^}]+\}\}/g, "$1");
  const s = clean.split(/(?<=[.!?])\s+|\n/).find(s => s.toLowerCase().includes(word)); return s ? s.trim() : "";
}

/* ================= actions ================= */
async function doRate(i, g){
  const w = feed[i].w; rate(w.word, g);
  slideState[i].rated = g === "again" ? "Again soon" : g === "hard" ? "Hard · " + ivlLabelDone(w.word) : g === "good" ? "Good · " + ivlLabelDone(w.word) : "Easy · " + ivlLabelDone(w.word);
  if (g === "again"){ // requeue before the done slide
    const doneIdx = feed.length - 1; feed.splice(doneIdx, 0, { type: "word", w }); slideState = Object.fromEntries(Object.entries(slideState).map(([k,v]) => [k >= doneIdx ? +k+1 : k, v])); slideState[doneIdx] = { flipped: false, defIdx: 0, rated: "", peeked: [], inboxed: [], mode: "see" };
    render(); setTimeout(() => nextSlide(i), 350); return;
  }
  rerenderSlide(i); rerenderSlide(feed.length-1); setTimeout(() => nextSlide(i), 350);
}
function ivlLabelDone(w){ const c = card(w); return c.ivl === 1 ? "tomorrow" : c.ivl < 30 ? "in " + c.ivl + " days" : "in " + Math.round(c.ivl/30) + " months"; }
function storyDone(i){
  const s = feed[i].s, st = slideState[i];
  s.words.forEach(w => { if (!st.peeked.includes(w)) reinforce(w); });
  P.stories[s.id] = Date.now(); P.days[today()] = (P.days[today()] || 0) + 1; saveP();
  st.rated = "Read · " + s.words.filter(w => !st.peeked.includes(w)).length + " of " + s.words.length + " recognised";
  rerenderSlide(i); rerenderSlide(feed.length-1); setTimeout(() => nextSlide(i), 350);
}
function addInbox(word, ctx, def, src){ if (!word || P.inbox.some(x => x.word === word)) return false; P.inbox.push({ word, ctx: ctx || "", def: def || "", src: src || "", added: Date.now() }); saveP(); return true; }
// fill in definitions for inbox items saved without one
async function fillInboxDefs(){
  for (const it of P.inbox){ if (it.def) continue; const g = await lookup(it.word, null); if (g){ it.def = g; const el = document.querySelector('.inbox li[data-w="' + CSS.escape(it.word) + '"] small'); if (el) el.textContent = g; } }
  saveP();
}
function inboxText(){ return "Teach me these words (British English, full cards please): " + P.inbox.map(i => i.word + (i.ctx ? ' ("' + i.ctx + '")' : "")).join("; "); }
async function sendInbox(){
  const text = inboxText();
  if (navigator.share){ try { await navigator.share({ text }); return; } catch(e){ if (e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(text); say("Copied. Paste it into the Claude app."); } catch(e){ ui.shownCode = text; render(); }
}
function exportFile(){
  const blob = new Blob([JSON.stringify(P, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "vocab-progress.json"; document.body.appendChild(a); a.click(); a.remove();
  P.lastBackup = Date.now(); saveP(); say("Backup file saved.");
}
function importFile(ev){
  const f = ev.target.files[0]; if (!f) return; const r = new FileReader();
  r.onload = async () => {
    let j = null; try { j = JSON.parse(r.result); } catch(e){}
    if (j && j.v === 4){ mergeP(P, j); await saveP(); buildFeed(); return say("Restored. " + Object.keys(j.cards).length + " cards merged."); }
    const known = [...legacyKnown(r.result)].filter(w => BY[w]); if (!known.length) return say("Nothing I recognise in that file.", true);
    known.forEach(w => { if (!P.cards[w] || P.cards[w].reps === 0) P.cards[w] = knownCard(true); }); await saveP(); buildFeed(); say("Restored " + known.length + " known words.");
  };
  r.readAsText(f);
}

document.addEventListener("input", e => { if (e.target.id === "wordq"){ ui.listQ = e.target.value; const r = document.getElementById("rows"); if (r) r.innerHTML = listRowsHTML(); return; } if (e.target.id === "watchq"){ watchSuggest(e.target.value); return; } if (e.target.id !== "catch") return; clearTimeout(catchTimer); const v = e.target.value; catchTimer = setTimeout(() => catchLookup(v), 450); });
document.addEventListener("keydown", e => { if (e.target.id === "wordq" && e.key === "Enter"){ e.target.blur(); return; } if (e.target.id === "watchq" && e.key === "Enter"){ watchSubmit(e.target.value); e.target.blur(); return; } if (e.target.id === "catch" && e.key === "Enter"){ clearTimeout(catchTimer); catchLookup(e.target.value); e.target.blur(); } });

document.addEventListener("touchstart", () => { const c = ctx(); if (c && c.state === "suspended") c.resume(); }, { once: true, passive: true });
document.addEventListener("click", async e => {
  const nb = e.target.closest("[data-nav]"); if (nb){ stopReading(); view = nb.dataset.nav; ui.shownCode = ""; ui.listQ = ""; render(); return; }
  if (e.target.id === "shade"){ closeWild(); return hidePop(); }
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act, i = +t.dataset.i, slide = t.closest(".slide"), si = slide ? +slide.dataset.i : -1;
  if (a === "say"){ e.stopPropagation(); return speak(t.dataset.w); }
  if (a === "flip"){ const ss = slideState[si]; ss.flipped = !ss.flipped; ss.defIdx = (ss.mode === "cloze" && ss.clozeDef != null) ? ss.clozeDef : 0; return rerenderSlide(si); }
  if (a === "def"){ e.stopPropagation(); slideState[si].defIdx = +t.dataset.k; return rerenderSlide(si); }
  if (a === "rate"){ e.stopPropagation(); return doRate(si, t.dataset.g); }
  if (a === "peek"){
    const w = BY[t.dataset.head]; if (!w) return; const st = slideState[i];
    if (st && !st.peeked.includes(w.word)){ st.peeked.push(w.word); peek(w.word); rerenderSlide(i); }
    const d = w.definitions[0];
    return showPop('<p class="w">' + esc(w.word) + ' <span class="ipa" data-act="say" data-w="' + esc(w.word) + '">▶\uFE0E ' + esc(w.pronunciation) + '</span></p><span class="tag">' + esc(d.context) + '</span><p class="def" style="font-size:15px">' + esc(d.def) + '</p><p class="desc">' + esc(d.description) + '</p><p style="font-size:13px;color:var(--dim);margin:0">Looked up, so this word comes back tomorrow.</p>');
  }
  if (a === "plain"){
    const word = t.dataset.word; if (!word || word.length < 2) return;
    if (BY[word]) { t.dataset.act = "peek"; t.dataset.head = word; return t.click(); }
    const src = t.dataset.n ? NEWS_BY[t.dataset.n] : (feed[i] && feed[i].s);
    const nAttr = t.dataset.n ? ' data-n="' + esc(t.dataset.n) + '"' : "";
    const nb = neighbours(t);
    const addBtn = (w, extra) => (P.inbox.some(x => x.word === w) ? '<p style="font-size:13px;color:var(--dim)">Already in your "want to learn" list.</p>' : '<button class="btn g" data-act="inbox" data-word="' + esc(w) + '" data-i="' + i + '"' + nAttr + '>Add "' + esc(w) + '"</button>') + (extra || "") + '<button class="btn o" data-act="closepop">Not now</button>';
    // 1) a phrase I glossed for this text
    const gp = glossedPhraseAt(word, nb, src);
    if (gp){ showPop('<p class="w">' + esc(gp.phrase) + '</p><p class="gloss">' + esc(gp.def) + '</p>' + addBtn(gp.phrase, '<p class="dimline" style="margin:-2px 0 10px">or just the word: <u data-act="plainword" data-word="' + esc(word) + '" data-i="' + i + '"' + nAttr + ' style="color:var(--amber);text-decoration:none">' + esc(word) + '</u></p>')); return; }
    // 2) single word popup, then check the dictionary for a phrasal verb around it
    showPop('<p class="w" id="popw">' + esc(word) + '</p><p class="gloss" id="gloss">…</p><div id="popact">' + addBtn(word) + '</div>');
    const [g, ph] = await Promise.all([lookup(word, src), phraseLookup(word, nb)]);
    const el = document.getElementById("gloss"); if (!el) return;
    if (ph){
      document.getElementById("popw").textContent = ph.phrase; el.textContent = ph.def;
      document.getElementById("popact").innerHTML = addBtn(ph.phrase, '<p class="dimline" style="margin:-2px 0 10px">or just the word: <u data-act="plainword" data-word="' + esc(word) + '" data-i="' + i + '"' + nAttr + ' style="color:var(--amber);text-decoration:none">' + esc(word) + '</u></p>');
    } else el.textContent = g ? g : g === "" ? "Not in the dictionary. Ask Claude." : "Dictionary not reachable right now.";
    return;
  }
  if (a === "plainword"){
    const word = t.dataset.word; const src = t.dataset.n ? NEWS_BY[t.dataset.n] : (feed[i] && feed[i].s); const nAttr = t.dataset.n ? ' data-n="' + esc(t.dataset.n) + '"' : "";
    showPop('<p class="w">' + esc(word) + '</p><p class="gloss" id="gloss">…</p>' + (P.inbox.some(x => x.word === word) ? '<p style="font-size:13px;color:var(--dim)">Already in your "want to learn" list.</p>' : '<button class="btn g" data-act="inbox" data-word="' + esc(word) + '" data-i="' + i + '"' + nAttr + '>Add "' + esc(word) + '"</button>') + '<button class="btn o" data-act="closepop">Not now</button>');
    const g = await lookup(word, src); const el = document.getElementById("gloss"); if (el) el.textContent = g ? g : g === "" ? "Not in the dictionary. Ask Claude." : "Dictionary not reachable right now.";
    return;
  }
  if (a === "inbox"){ const word = t.dataset.word; const src = t.dataset.n ? NEWS_BY[t.dataset.n] : (feed[i] && feed[i].s); const ge = document.getElementById("gloss"); const gt = ge ? ge.textContent : ""; addInbox(word, src ? sentenceAround(src.text, word.split(" ")[0]) : "", /^(…|Not in the dictionary|Dictionary not reachable)/.test(gt) ? "" : gt); if (slideState[i]) slideState[i].inboxed.push(word); hidePop(); render(); return; }
  if (a === "closepop") return hidePop();
  if (a === "watchmode"){ ui.watchMode = t.dataset.m; ui.reelList = null; for (const k in YGW) delete YGW[k]; for (const k in TTL) delete TTL[k]; render(); return; }
  if (a === "ttretry"){ e.preventDefault(); const k = +t.dataset.i; ttUnmount(k); setTimeout(() => ttMount(k), 300); return; }
  if (a === "ygprev"){ const c = YGW[t.dataset.id]; if (c) try { c.w.previous(); } catch(e){} return; }
  if (a === "ygnext"){ const c = YGW[t.dataset.id]; if (c) try { c.w.next(); } catch(e){} return; }
  if (a === "watchpick") return watchPlay(t.dataset.w);
  if (a === "watchgo"){ const q = document.getElementById("watchq"); watchSubmit(q ? q.value : ""); if (q) q.blur(); return; }
  if (a === "watchall"){ ui.watchAll = true; const l = document.getElementById("wlist"); if (l) l.innerHTML = watchListHTML(""); return; }
  if (a === "wild"){ e.stopPropagation(); return openWild(t.dataset.w); }
  if (a === "read"){ e.stopPropagation(); const id = t.dataset.id; const [kind, key] = [id.slice(0, id.indexOf(":")), id.slice(id.indexOf(":") + 1)]; const src = kind === "news" ? NEWS_BY[key] : STORIES.find(x => x.id === key); if (src) readAloud(id, (src.title ? src.title + ". " : "") + src.text); return; }
  if (a === "closewild") return closeWild();
  if (a === "storydone") return storyDone(i);

  if (a === "open") return toggleDetail(t.dataset.w);
  if (a === "odef"){ e.stopPropagation(); return switchDetailDef(+t.dataset.k); }
  if (a === "toggle"){ e.stopPropagation(); const w = t.dataset.w; if (status(w) === "known") delete P.cards[w]; else P.cards[w] = knownCard(false); await saveP(); const s = status(w); t.className = "badge " + s; t.textContent = s; const rowEl = t.closest(".lr"); if (rowEl) rowEl.className = "lr " + s; const d = document.querySelector('.detail[data-w="' + CSS.escape(w) + '"]'); if (d){ const tmp = document.createElement("div"); tmp.innerHTML = detailHTML(BY[w]); d.replaceWith(tmp.firstChild); } return; }

  if (a === "rminbox"){ const item = P.inbox.find(x => x.word === t.dataset.w); P.inbox = P.inbox.filter(x => x.word !== t.dataset.w); if (item){ P.trash = (P.trash || []).filter(x => x.word !== item.word); item.removed = Date.now(); P.trash.unshift(item); } await saveP(); return render(); }
  if (a === "restore"){ const item = (P.trash || []).find(x => x.word === t.dataset.w); P.trash = (P.trash || []).filter(x => x.word !== t.dataset.w); if (item && !P.inbox.some(x => x.word === item.word)){ delete item.removed; P.inbox.push(item); } await saveP(); return render(); }
  if (a === "emptytrash"){ if (!confirm("Delete these " + (P.trash || []).length + " words for good?")) return; P.trash = []; await saveP(); return render(); }

  if (a === "sendinbox") return sendInbox();
  if (a === "copyinbox"){ try { await navigator.clipboard.writeText(inboxText()); say("Copied."); } catch(e){ ui.shownCode = inboxText(); render(); } return; }
  if (a === "export") return exportFile();
  if (a === "importbtn") return document.getElementById("file").click();
  if (a === "copycode"){ const code = WORDS.filter(w => status(w.word) === "known").map(w => w.word).join("|"); if (!code) return say("No known words yet.", true); try { await navigator.clipboard.writeText(code); say("Copied."); } catch(e){ ui.shownCode = code; render(); } return; }

  if (a === "reset"){ if (!confirm("Reset ALL progress? This cannot be undone.")) return; P = emptyP(); await saveP(); buildFeed(); return say("Progress reset."); }
});

/* ================= boot ================= */
async function loadJSON(name){
  try { const r = await fetch(name, { cache: "no-cache" }); const j = await r.json(); lsSet("wsv.cache." + name, JSON.stringify(j)); return j; }
  catch(e){ try { return JSON.parse(lsGet("wsv.cache." + name) || "[]"); } catch(_){ return []; } }
}
async function boot(){
  if (window.speechSynthesis){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; }
  let NIMG;
  let VID; [WORDS, STORIES, NEWS, AUDIO, NIMG, VID] = await Promise.all([loadJSON("words.json"), loadJSON("stories.json"), loadJSON("news.json"), loadJSON("audio/index.json"), loadJSON("news-images.json"), loadJSON("videos.json")]);
  VIDEOS = (VID && VID.items) || [];
  if (NIMG && !Array.isArray(NIMG) && NEWS && NEWS.items) NEWS.items.forEach(n => { const m = NIMG[n.id]; if (m && m.image) n.pressImage = m.image; });
  if (!AUDIO || Array.isArray(AUDIO)) AUDIO = {};
  if (NEWS && NEWS.items) NEWS.items.forEach(n => NEWS_BY[n.id] = n); else NEWS = null;
  WORDS.forEach(w => BY[w.word] = w);
  await loadP();
  // words that have become cards leave the "want to learn" list on their own
  const norm = ph => String(ph).toLowerCase().split(/\s+/).map(lemma).join(" ");
  const inVocab = x => !!BY[x.word] || !!BY[norm(x.word)] || WORDS.some(w => w.word.includes(" ") && wordRegex(w.word).test(x.word));
  if (P.inbox.some(inVocab)){ P.inbox = P.inbox.filter(x => !inVocab(x)); await saveP(); }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  const lastV = lsGet("wsv.version");
  const knownN = WORDS.filter(w => status(w.word) === "known").length;
  if (lastV && lastV !== APP_VERSION) ui.banner = "Updated to " + APP_VERSION + ". Progress kept: " + knownN + " known, " + Object.keys(P.cards).length + " cards in total.";
  lsSet("wsv.version", APP_VERSION);
  setTimeout(() => { try { ygLoad().catch(() => {}); } catch(e){} }, 1500);
  if (!ui.banner && Object.keys(P.cards).length >= 5 && Date.now() - (P.lastBackup || 0) > 30*864e5){ ui.banner = "Tip: Stats → Save backup file. Five seconds."; ui.bannerWarn = true; }
  buildFeed();
  const addQ = new URLSearchParams(location.search).get("add");
  if (addQ){ view = "catch"; ui.catchQ = addQ; history.replaceState(null, "", location.pathname); }
  render(); prefetchImages(); prefetchAudio();
  if (addQ) catchLookup(addQ);
}
boot();

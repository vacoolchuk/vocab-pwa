<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vocabulary">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>My Vocabulary</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&family=Literata:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root{
  --screen:#000;--surface:#17171A;--surface2:#222226;--line:#2B2B30;
  --milk:#F2EDE3;--dim:#8C877D;--faint:#5B5852;--amber:#D4A24C;
  --again:#8E3B3B;--hard:#8A6A2C;--good:#3C6B46;--easy:#3B5A7A;
  --new:#6B675F;--learning:#D4A24C;--review:#7FA0C4;--known:#8DBB8A;
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --ui:"Barlow","Helvetica Neue",Arial,sans-serif;
  --book:"Literata",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --nav:60px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--screen);color:var(--milk);font-family:var(--ui);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
#app{height:100%}
.row{display:flex;gap:8px;align-items:center}

/* ---------- feed ---------- */
#feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--screen)}
.tinted{--tint:#1B2A20;background:radial-gradient(130% 75% at 50% -5%,var(--tint) 0%,#0B100D 62%,#050706 100%)}
#feed::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;padding:calc(var(--sat) + 52px) 22px calc(var(--nav) + var(--sab) + 14px);position:relative;overflow:hidden}
.slide .meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:14px;letter-spacing:.04em;color:var(--dim);margin-bottom:10px;position:relative;z-index:2}
.slide .meta .st{color:var(--dim)}
.slide .meta .st.learning{color:var(--learning)}.slide .meta .st.review{color:var(--review)}.slide .meta .st.known{color:var(--known)}
.still{position:absolute;inset:0;z-index:0}
.still img{width:100%;height:100%;object-fit:cover;display:block;opacity:0}
.still img.on{opacity:.55;transition:opacity .4s ease}
.still:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 35%,rgba(0,0,0,.25) 60%,rgba(0,0,0,.92) 100%)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;z-index:1}
.front{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;cursor:pointer;padding-bottom:12vh}
.front .w{font-family:var(--display);font-weight:600;font-size:64px;line-height:.95;letter-spacing:-.01em;margin:0 0 18px;color:var(--milk);text-shadow:0 2px 24px rgba(0,0,0,.6)}
.saybtn{font-family:var(--mono);font-size:15px;color:var(--amber);background:rgba(0,0,0,.55);border:1px solid rgba(212,162,76,.35);border-radius:4px;padding:7px 14px;letter-spacing:.02em}
.saybtn:before{content:"▶";font-size:10px;margin-right:9px;vertical-align:1px}
.back{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;cursor:pointer}
.back .w{font-family:var(--display);font-weight:600;font-size:34px;line-height:1;margin:0 10px 0 0}
.back .ipa{font-family:var(--mono);font-size:12px;color:var(--amber)}
.mtabs{display:flex;gap:0;margin:0 0 14px;border-bottom:1px solid var(--line)}
.mtabs button{padding:8px 14px 10px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;color:var(--dim);font-family:var(--display);font-size:16px;letter-spacing:.03em}
.mtabs button.on{color:var(--amber);border-bottom-color:var(--amber)}
.tag{display:inline-block;font-family:var(--display);font-size:13px;letter-spacing:.05em;color:var(--amber);padding:0;margin:8px 0 2px}
.def{margin:8px 0 8px;font-family:var(--book);font-size:19px;font-weight:500;line-height:1.4;color:var(--milk)}
.desc{margin:0 0 16px;font-family:var(--book);font-size:15px;color:var(--dim);line-height:1.6}
.ex{border-top:1px solid var(--line);padding-top:12px}
.ex h4{margin:0 0 10px;font-family:var(--display);font-size:13px;font-weight:500;letter-spacing:.05em;color:var(--faint)}
.ex p{margin:0 0 10px;font-family:var(--book);font-size:15px;color:#C9C3B6;line-height:1.55;padding-left:14px;border-left:2px solid var(--line)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:12px;background:var(--line);border:1px solid var(--line)}
.rate button{padding:15px 4px;border:0;font-family:var(--display);font-size:18px;letter-spacing:.04em;color:var(--milk);background:var(--surface)}
.rate .again{background:var(--again)}.rate .hard{background:var(--hard)}.rate .good{background:var(--good)}.rate .easy{background:var(--easy)}
.rate small{display:none}
.rated{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;background:rgba(5,7,6,.92);font-family:var(--display);font-size:28px;color:var(--amber);letter-spacing:.02em}

/* ---------- story ---------- */
.story{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;justify-content:center}
.story h2{margin:0 0 16px;font-family:var(--display);font-weight:600;font-size:34px;line-height:1;letter-spacing:-.01em}
.story p{margin:0 0 12px;font-family:var(--book);font-size:18px;line-height:1.7;white-space:pre-wrap;color:#E6E0D4}
.story .t{border-radius:2px;padding:0 1px}
.story .t.peeked{background:rgba(212,162,76,.22);color:var(--amber)}
.story .t.inbox{background:rgba(141,187,138,.2);color:var(--known)}
.story .t:active{background:var(--surface2)}
.sdone{margin-top:12px}
.sdone button{width:100%;padding:14px;border:1px solid var(--amber);background:transparent;color:var(--amber);font-family:var(--display);font-size:18px;letter-spacing:.05em}
.sreveal{font-family:var(--ui);font-size:13px;color:var(--dim);margin:6px 0 0;line-height:1.5}
.sreveal b{color:var(--milk);font-weight:500}

/* ---------- done ---------- */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.done .big{display:none}
.done h2{margin:0 0 8px;font-family:var(--display);font-weight:600;font-size:56px;line-height:.95;letter-spacing:-.01em;color:var(--amber)}
.done p{margin:0 0 4px;color:var(--dim);font-size:15px}
.done .row{display:flex;gap:28px;margin:28px 0}
.done .st{text-align:center}.done .st b{display:block;font-family:var(--display);font-size:36px;font-weight:600;line-height:1}.done .st span{font-size:12px;color:var(--dim)}

/* ---------- popup ---------- */
#pop{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:20px 22px calc(var(--sab) + 22px);transform:translateY(110%);transition:transform .22s ease;max-height:70vh;overflow-y:auto}
#pop.show{transform:none}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
#shade.show{display:block}
#pop .w{font-family:var(--display);font-weight:600;font-size:34px;line-height:1;margin:0 0 6px}
#pop .ctx{font-family:var(--book);font-size:14px;color:var(--dim);font-style:italic;margin:10px 0 14px;line-height:1.5}
#pop .gloss{font-family:var(--book);font-size:17px;color:var(--milk);margin:6px 0 18px;line-height:1.5}
#pop .tag{margin:0}
#pop .def{font-size:17px}
#pop .desc{margin-bottom:10px}
#pop .ipa{font-family:var(--mono);font-size:13px;color:var(--amber)}

/* ---------- nav ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--sab));padding-bottom:var(--sab);display:flex;background:var(--screen);border-top:1px solid var(--line);z-index:30}
#nav button{flex:1;border:0;background:transparent;color:var(--faint);font-family:var(--display);font-size:17px;letter-spacing:.05em;position:relative}
#nav button span{display:none}
#nav button.on{color:var(--amber)}
#nav button.on:before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--amber)}
#nav button i{position:absolute;top:10px;right:22%;background:var(--amber);color:#000;font-style:normal;font-family:var(--ui);font-size:10px;font-weight:700;border-radius:99px;padding:1px 5px}

/* ---------- pages ---------- */
.page{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 52px) 18px calc(var(--nav) + var(--sab) + 24px)}
.title{margin:0 0 18px;font-family:var(--display);font-weight:600;font-size:40px;line-height:1;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
.title small{margin-left:auto;font-size:15px;color:var(--dim);font-weight:400;letter-spacing:.04em}
.list{border-top:1px solid var(--line)}
.lr{display:grid;grid-template-columns:1.5fr 1.5fr auto;padding:14px 0 14px 14px;align-items:center;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.lr:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--new)}
.lr.learning:before{background:var(--learning)}.lr.review:before{background:var(--review)}.lr.known:before{background:var(--known)}
.lr b{font-family:var(--display);font-size:22px;font-weight:500;line-height:1}
.lr .ipa{font-family:var(--mono);font-size:12px;color:var(--amber)}
.badge{font-family:var(--display);font-size:14px;letter-spacing:.05em;color:var(--dim);cursor:pointer;padding:4px 0 4px 10px}
.badge.learning{color:var(--learning)}.badge.review{color:var(--review)}.badge.known{color:var(--known)}
.detail{padding:12px 0 18px 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.04)}
.detail .def{font-size:16px}.detail .desc{font-size:14px}.detail .ex p{font-size:14px}
.box{background:rgba(255,255,255,.04);padding:18px;margin-bottom:10px;border:1px solid var(--line)}
.box h3{margin:0 0 6px;font-family:var(--display);font-size:20px;font-weight:500;letter-spacing:.02em}
.box p{margin:0 0 12px;font-size:14px;color:var(--dim);line-height:1.5}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-bottom:10px;background:var(--line);border:1px solid var(--line)}
.stats4 .box{padding:14px 6px;text-align:center;margin:0;border:0}
.stats4 b{display:block;font-family:var(--display);font-size:32px;font-weight:600;line-height:1}.stats4 span{font-family:var(--display);font-size:13px;letter-spacing:.05em;color:var(--dim)}
.bar{height:3px;background:var(--line);margin-top:12px}
.bar i{display:block;height:100%;background:var(--known)}
.btn{width:100%;padding:13px;border:1px solid var(--amber);margin-bottom:8px;background:var(--amber);color:#000;font-family:var(--display);font-size:18px;letter-spacing:.05em}
.btn.g{background:var(--amber);color:#000}
.btn.o{background:transparent;color:var(--amber)}
.btn.sm{width:auto;padding:9px 16px;margin:0;font-size:15px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);font-size:14px;background:var(--screen);color:var(--milk);font-family:inherit}
.inbox{list-style:none;margin:0 0 14px;padding:0}
.inbox li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.inbox li b{font-family:var(--display);font-size:20px;font-weight:500}
.inbox li small{display:block;font-family:var(--book);font-size:13px;color:var(--dim);margin-top:3px;line-height:1.45}
.inbox li u{margin-left:auto;color:var(--faint);cursor:pointer;font-size:13px;text-decoration:none}
.msg{margin:8px 0 0;font-size:13px;color:var(--known);word-break:break-all}.msg.err{color:var(--amber)}
.banner{background:var(--surface);border-left:3px solid var(--known);color:var(--milk);padding:12px 14px;font-size:14px;margin-bottom:14px;display:flex;justify-content:space-between;gap:8px}
.banner.warn{border-left-color:var(--amber)}
.banner u{cursor:pointer;text-decoration:none;color:var(--amber);font-family:var(--display);letter-spacing:.05em}
.empty{text-align:center;padding:3rem 1rem;color:var(--dim);font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="app"><p class="empty">Loading…</p></div>
<div id="shade"></div><div id="pop"></div>
<nav id="nav">
  <button data-nav="feed" class="on"><span>▲</span>Today</button>
  <button data-nav="list"><span>≡</span>Words</button>
  <button data-nav="stats"><span>◔</span>Stats</button>
</nav>

<script>
"use strict";
const APP_VERSION = "2026.10.24-12";
const KEY = "wsv.progress.v4";
const KEY_V3 = "wsv.progress.v3";
const LEGACY_KEYS = ["vocabstatus2","vocabstatus","vocab_status","vocabProgress","vocab-progress"];
const NEW_PER_DAY = 10, STORY_EVERY = 4, MAX_STORIES = 3, KNOWN_IVL = 30, MAX_IVL = 120;

let WORDS = [], STORIES = [], BY = {};
let P = null;                 // progress
let feed = [];                // slides for today
let slideState = {};          // per slide: flipped, defIdx, rated, peeked, inboxed
let view = "feed";
let ui = { open: null, openDef: 0, msg: "", banner: "", bannerWarn: false, shownCode: "" };

/* ================= storage ================= */
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); return true; } catch(e){ return false; } };
function idbOpen(){ return new Promise((res,rej) => { if (!window.indexedDB) return rej(); const r = indexedDB.open("wsv",1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ try { const db = await idbOpen(); return await new Promise(res => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch(e){ return null; } }
async function idbSet(k,v){ try { const db = await idbOpen(); await new Promise(res => { const tx = db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete = res; tx.onerror = res; }); } catch(e){} }

const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const addDays = (key, n) => { const [y,m,d] = key.split("-").map(Number); const t = new Date(y, m-1, d + n); return t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,"0") + "-" + String(t.getDate()).padStart(2,"0"); };
const dayDiff = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);

function emptyP(){ return { v: 4, cards: {}, inbox: [], days: {}, stories: {}, lastBackup: 0, newToday: {} }; }
function newCard(){ return { ivl: 0, ease: 2.5, due: today(), reps: 0, lapses: 0 }; }
function knownCard(spread){ const c = newCard(); c.ivl = KNOWN_IVL; c.reps = 3; c.due = addDays(today(), spread ? Math.floor(Math.random()*21) : KNOWN_IVL); return c; }

// legacy: v3 JSON {known:[]}, "a:known,b:learning", "a|b|c"
function legacyKnown(raw){
  const out = new Set(); if (!raw) return out; raw = String(raw).trim();
  try { const j = JSON.parse(raw); if (Array.isArray(j)) j.forEach(w => out.add(w)); else if (j && Array.isArray(j.known)) j.known.forEach(w => out.add(w)); else if (j && typeof j === "object" && !j.cards) Object.entries(j).forEach(([w,s]) => { if (s === "known") out.add(w); }); return out; } catch(e){}
  if (raw.includes(":")) raw.split(",").forEach(p => { const [w,s] = p.split(":"); if (w && s && s.trim() === "known") out.add(w.trim()); });
  else raw.split("|").forEach(w => { if (w.trim()) out.add(w.trim()); });
  return out;
}
function mergeP(a, b){
  if (!b) return a;
  Object.entries(b.cards || {}).forEach(([w,c]) => { const x = a.cards[w]; if (!x || (c.reps||0) > (x.reps||0) || ((c.reps||0) === (x.reps||0) && c.due > x.due)) a.cards[w] = c; });
  (b.inbox || []).forEach(i => { if (!a.inbox.some(x => x.word === i.word)) a.inbox.push(i); });
  Object.entries(b.days || {}).forEach(([k,n]) => { a.days[k] = Math.max(a.days[k] || 0, n); });
  Object.entries(b.stories || {}).forEach(([k,t]) => { a.stories[k] = Math.max(a.stories[k] || 0, t); });
  a.lastBackup = Math.max(a.lastBackup || 0, b.lastBackup || 0);
  return a;
}
async function loadP(){
  let p = emptyP();
  const parse = r => { try { const j = JSON.parse(r); return j && j.v === 4 ? j : null; } catch(e){ return null; } };
  p = mergeP(p, parse(lsGet(KEY)));
  p = mergeP(p, parse(await idbGet(KEY)));
  // migrate: anything older only ever adds "known"
  const known = new Set();
  legacyKnown(lsGet(KEY_V3)).forEach(w => known.add(w));
  legacyKnown(await idbGet(KEY_V3)).forEach(w => known.add(w));
  LEGACY_KEYS.forEach(k => legacyKnown(lsGet(k)).forEach(w => known.add(w)));
  known.forEach(w => { if (!p.cards[w]) p.cards[w] = knownCard(true); });
  // clamp anything that ran away during testing
  Object.values(p.cards).forEach(c => { if (c.ivl > MAX_IVL){ c.ivl = MAX_IVL; c.due = addDays(today(), MAX_IVL); } if (c.ease > 3) c.ease = 3; });
  P = p;
  await saveP();
}
async function saveP(){ const s = JSON.stringify(P); lsSet(KEY, s); await idbSet(KEY, s); }

/* ================= SRS ================= */
const card = w => P.cards[w];
function status(w){ const c = card(w); if (!c || c.reps === 0) return "new"; if (c.ivl < 7) return "learning"; if (c.ivl < KNOWN_IVL) return "review"; return "known"; }
function rate(w, g){
  const c = P.cards[w] || (P.cards[w] = newCard());
  const t = today();
  const ratedToday = c.lastDay === t && c.reps > 0;   // a second rating on the same day must not compound the interval
  if (g === "again"){ c.lapses++; c.ivl = 0; c.ease = Math.max(1.3, c.ease - 0.2); c.due = t; }
  else if (g === "hard"){ if (!ratedToday) c.ivl = c.ivl < 1 ? 1 : Math.ceil(c.ivl * 1.2); c.ease = Math.max(1.3, c.ease - 0.15); c.due = addDays(t, Math.max(1, c.ivl)); }
  else if (g === "good"){ if (!ratedToday) c.ivl = c.ivl < 1 ? 1 : c.ivl < 3 ? 3 : Math.ceil(c.ivl * c.ease); c.due = addDays(t, Math.max(1, c.ivl)); }
  else { if (!ratedToday){ c.ivl = c.ivl < 1 ? 3 : Math.ceil(c.ivl * c.ease * 1.3); c.ease = Math.min(3, c.ease + 0.15); } c.due = addDays(t, Math.max(1, c.ivl)); }
  if (c.ivl > MAX_IVL){ c.ivl = MAX_IVL; c.due = addDays(t, MAX_IVL); }
  c.reps++; c.last = Date.now(); c.lastDay = t;
  P.days[t] = (P.days[t] || 0) + 1;
  saveP();
}
function peek(w){ const c = P.cards[w] || (P.cards[w] = newCard()); if (c.reps > 0){ c.ivl = Math.max(1, Math.floor(c.ivl / 2)); c.due = addDays(today(), 1); } saveP(); }
function reinforce(w){ const c = P.cards[w]; if (!c || c.reps === 0 || c.ivl < 1) return; c.ivl = Math.ceil(c.ivl * 1.15); c.due = addDays(today(), c.ivl); }
function streak(){ let n = 0, d = today(); if (!P.days[d]) d = addDays(d, -1); while (P.days[d]){ n++; d = addDays(d, -1); } return n; }
function dueCount(dayKey){ return WORDS.filter(w => { const c = card(w.word); return c && c.reps > 0 && c.due <= dayKey; }).length; }

/* ================= feed ================= */
function shuffle(a){ a = [...a]; for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function buildFeed(ahead){
  const t = today();
  let cards;
  if (ahead){
    cards = shuffle(WORDS).slice(0, 10);
  } else {
    const due = WORDS.filter(w => { const c = card(w.word); return c && c.reps > 0 && c.due <= t; }).sort((a,b) => card(a.word).due.localeCompare(card(b.word).due));
    const introduced = P.newToday[t] || [];
    const fresh = WORDS.filter(w => status(w.word) === "new" && !introduced.includes(w.word)).slice(0, Math.max(0, NEW_PER_DAY - introduced.length));
    const introducedWords = WORDS.filter(w => introduced.includes(w.word) && status(w.word) === "new");
    cards = shuffle([...due, ...fresh, ...introducedWords]);
    P.newToday = { [t]: [...introduced, ...fresh.map(w => w.word)] };
    saveP();
  }
  // stories: prefer ones whose words sit in the "gap" (ivl >= 7) and not read in the last 5 days
  const score = s => s.words.reduce((n,w) => { const c = card(w); return n + (c && c.reps > 0 && c.ivl >= 7 ? 1 : 0); }, 0);
  const recent = s => (P.stories[s.id] || 0) > Date.now() - 5*864e5;
  let pool = STORIES.filter(s => !recent(s)).sort((a,b) => score(b) - score(a) || (P.stories[a.id]||0) - (P.stories[b.id]||0));
  if (!pool.length && cards.length) pool = [...STORIES].sort((a,b) => (P.stories[a.id]||0) - (P.stories[b.id]||0));
  const stories = pool.slice(0, cards.length ? Math.min(MAX_STORIES, Math.max(1, Math.floor(cards.length / STORY_EVERY))) : 0);
  feed = []; slideState = {};
  cards.forEach((w,i) => { feed.push({ type: "word", w }); if ((i+1) % STORY_EVERY === 0 && stories.length) feed.push({ type: "story", s: stories.shift() }); });
  stories.forEach(s => feed.push({ type: "story", s }));
  feed.push({ type: "done" });
  feed.forEach((f,i) => slideState[i] = { flipped: false, defIdx: 0, rated: "", peeked: [], inboxed: [] });
}

/* images: free CC photos (Openverse, then Wikimedia Commons). Several candidates per word,

const imgCache = {};
async function imageCandidates(w){
  if (w.image) return [w.image];
  if (!w.imgQuery) return [];
  const k = "wsv.img." + w.word;
  try { const c = JSON.parse(lsGet(k) || "null"); if (c && c.ok) return [c.ok]; if (c && c.none && Date.now() - c.none < 864e5) return []; } catch(e){}
  if (imgCache[w.word]) return imgCache[w.word];
  imgCache[w.word] = (async () => {
    const out = [];
    try {
      const r = await fetch("https://api.openverse.org/v1/images/?q=" + encodeURIComponent(w.imgQuery) + "&page_size=8&mature=false&license_type=commercial&extension=jpg,png", { headers: { Accept: "application/json" } });
      const j = await r.json();
      (j.results || []).forEach(x => { if (x.thumbnail) out.push(x.thumbnail); else if (x.url) out.push(x.url); });
    } catch(e){}
    try {
      const r = await fetch("https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=" + encodeURIComponent("filetype:bitmap " + w.imgQuery) + "&gsrnamespace=6&gsrlimit=4&prop=imageinfo&iiprop=url&iiurlwidth=640&format=json&origin=*");
      const j = await r.json();
      Object.values((j.query || {}).pages || {}).forEach(pg => { if (pg.imageinfo && pg.imageinfo[0].thumburl) out.push(pg.imageinfo[0].thumburl); });
    } catch(e){}
    if (!out.length) lsSet(k, JSON.stringify({ none: Date.now() }));
    return out.slice(0, 6);
  })();
  return imgCache[w.word];
}
function loadInto(img, w, urls, i){
  if (!img.isConnected) return;

  img.onerror = () => loadInto(img, w, urls, i + 1);
  img.onload = () => { lsSet("wsv.img." + w.word, JSON.stringify({ ok: urls[i] })); img.classList.add("on"); };

/* short definition for any tapped word: my own gloss from the story first, then a free dictionary */
const glossCache = {};
function phraseGloss(word, story){
  const g = (story && story.gloss) || {};
  if (g[word]) return g[word];
  const hit = Object.keys(g).find(k => k.includes(" ") && k.split(" ").includes(word)); // part of a glossed phrase
  return hit ? hit + ": " + g[hit] : null;
}
function stems(w){
  const out = [w];
  if (w.endsWith("ies")) out.push(w.slice(0,-3) + "y");
  if (w.endsWith("es")) out.push(w.slice(0,-2));
  if (w.endsWith("s")) out.push(w.slice(0,-1));
  if (w.endsWith("ed")) out.push(w.slice(0,-2), w.slice(0,-1), w.slice(0,-3));
  if (w.endsWith("ing")) out.push(w.slice(0,-3), w.slice(0,-3) + "e", w.slice(0,-4));
  if (w.endsWith("ly")) out.push(w.slice(0,-2));
  if (w.endsWith("er") || w.endsWith("est")) out.push(w.replace(/(er|est)$/, ""));
  return [...new Set(out.filter(x => x.length > 2))];
}
async function lookup(word, story, depth = 0){
  const own = phraseGloss(word, story); if (own) return own;
  if (glossCache[word] !== undefined) return glossCache[word];
  let result = null, reached = false;
  const strip = h => String(h).replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
  for (const s of stems(word)){
    // 1. Free Dictionary API
    try {
      const r = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(s));
      reached = true;
      if (r.ok){ const j = await r.json(); const m = j[0] && j[0].meanings && j[0].meanings[0]; const d = m && m.definitions && m.definitions[0]; if (d){ result = (m.partOfSpeech ? m.partOfSpeech + " · " : "") + d.definition; break; } }
    } catch(e){}
    // 2. Wiktionary
    try {
      const r = await fetch("https://en.wiktionary.org/api/rest_v1/page/definition/" + encodeURIComponent(s) + "?redirect=true", { headers: { Accept: "application/json" } });
      reached = true;
      if (r.ok){ const j = await r.json(); const m = j.en && j.en[0]; const d = m && m.definitions && m.definitions.find(x => strip(x.definition)); if (d){ result = (m.partOfSpeech ? m.partOfSpeech.toLowerCase() + " · " : "") + strip(d.definition); break; } }
    } catch(e){}
  }
  if (!result && !reached) return null; // offline: do not cache
  // "plural of resident", "simple past of agree": follow to the base word once
  const form = result && result.match(/^(?:[a-z ]+ · )?(?:plural|past participle|simple past|past tense|present participle|third-person singular[^ ]*|comparative|superlative|alternative (?:form|spelling)|inflection)[a-z ,-]* of (?:the verb |the adjective |the noun )?["“]?([A-Za-z-]+)/i);
  if (form && form[1] && form[1].toLowerCase() !== word && depth < 1){ const base = await lookup(form[1].toLowerCase(), story, depth + 1); if (base) result = base; }
  glossCache[word] = result || ""; return result || "";
}
function sentenceAround(text, word){
  const clean = text.replace(/\{\{([^|]+)\|[^}]+\}\}/g, "$1");
  const s = clean.split(/(?<=[.!?])\s+|\n/).find(s => s.toLowerCase().includes(word)); return s ? s.trim() : "";
}

function addInbox(word, ctx, def){ if (!word || P.inbox.some(x => x.word === word)) return false; P.inbox.push({ word, ctx, def: def || "", added: Date.now() }); saveP(); return true; }
// fill in definitions for inbox items saved without one
async function fillInboxDefs(){
  for (const it of P.inbox){ if (it.def) continue; const g = await lookup(it.word, null); if (g){ it.def = g; const el = document.querySelector('.inbox li[data-w="' + CSS.escape(it.word) + '"] small'); if (el) el.textContent = g; } }
  saveP();
}
function inboxText(){ return "Teach me these words (British English, full cards please): " + P.inbox.map(i => i.word + (i.ctx ? ' ("' + i.ctx + '")' : "")).join("; "); }
async function sendInbox(){
  const text = inboxText();
  if (navigator.share){ try { await navigator.share({ text }); return; } catch(e){ if (e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(text); say("Copied. Paste it into the Claude app."); } catch(e){ ui.shownCode = text; render(); }
}
function exportFile(){
  const blob = new Blob([JSON.stringify(P, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "vocab-progress.json"; document.body.appendChild(a); a.click(); a.remove();
  P.lastBackup = Date.now(); saveP(); say("Backup file saved.");
}
function importFile(ev){
  const f = ev.target.files[0]; if (!f) return; const r = new FileReader();
  r.onload = async () => {
    let j = null; try { j = JSON.parse(r.result); } catch(e){}
    if (j && j.v === 4){ mergeP(P, j); await saveP(); buildFeed(); return say("Restored. " + Object.keys(j.cards).length + " cards merged."); }
    const known = [...legacyKnown(r.result)].filter(w => BY[w]); if (!known.length) return say("Nothing I recognise in that file.", true);
    known.forEach(w => { if (!P.cards[w] || P.cards[w].reps === 0) P.cards[w] = knownCard(true); }); await saveP(); buildFeed(); say("Restored " + known.length + " known words.");
  };
  r.readAsText(f);
}

document.addEventListener("click", async e => {
  const nb = e.target.closest("[data-nav]"); if (nb){ view = nb.dataset.nav; ui.shownCode = ""; render(); return; }
  if (e.target.id === "shade") return hidePop();
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act, i = +t.dataset.i, slide = t.closest(".slide"), si = slide ? +slide.dataset.i : -1;
  if (a === "say"){ e.stopPropagation(); return speak(t.dataset.w); }
  if (a === "flip"){ slideState[si].flipped = !slideState[si].flipped; slideState[si].defIdx = 0; return rerenderSlide(si); }
  if (a === "def"){ e.stopPropagation(); slideState[si].defIdx = +t.dataset.k; return rerenderSlide(si); }
  if (a === "rate"){ e.stopPropagation(); return doRate(si, t.dataset.g); }
  if (a === "peek"){
    const w = BY[t.dataset.head]; if (!w) return; const st = slideState[i];
    if (!st.peeked.includes(w.word)){ st.peeked.push(w.word); peek(w.word); rerenderSlide(i); }
    const d = w.definitions[0];
    return showPop('<p class="w">' + esc(w.word) + ' <span class="ipa" data-act="say" data-w="' + esc(w.word) + '">▶ ' + esc(w.pronunciation) + '</span></p><span class="tag">' + esc(d.context) + '</span><p class="def" style="font-size:15px">' + esc(d.def) + '</p><p class="desc">' + esc(d.description) + '</p><p style="font-size:13px;color:var(--dim);margin:0">Looked up, so this word comes back tomorrow.</p>');
  }
  if (a === "plain"){
    const word = t.dataset.word; if (!word || word.length < 2) return;
    if (BY[word]) { t.dataset.act = "peek"; t.dataset.head = word; return t.click(); }
    const already = slideState[i].inboxed.includes(word) || P.inbox.some(x => x.word === word);
    showPop('<p class="w">' + esc(word) + '</p><p class="gloss" id="gloss">…</p>' + (already ? '<p style="font-size:13px;color:var(--dim)">Already in your "want to learn" list.</p>' : '<button class="btn g" data-act="inbox" data-word="' + esc(word) + '" data-i="' + i + '">Add to "want to learn"</button><button class="btn o" data-act="closepop">Not now</button>'));
    const g = await lookup(word, feed[i].s); const el = document.getElementById("gloss"); if (el) el.textContent = g ? g : g === "" ? "Not in the dictionary. Ask Claude." : "Dictionary not reachable right now.";
    return;
  }
  if (a === "inbox"){ const word = t.dataset.word; const ge = document.getElementById("gloss"); const gt = ge ? ge.textContent : ""; addInbox(word, sentenceAround(feed[i].s.text, word), /^(…|Not in the dictionary|Dictionary not reachable)/.test(gt) ? "" : gt); slideState[i].inboxed.push(word); hidePop(); render(); return; }
  if (a === "closepop") return hidePop();
  if (a === "storydone") return storyDone(i);
  if (a === "ahead"){ buildFeed(true); render(); const fe = document.getElementById("feed"); if (fe) fe.scrollTop = 0; return; }
  if (a === "open") return toggleDetail(t.dataset.w);
  if (a === "odef"){ e.stopPropagation(); return switchDetailDef(+t.dataset.k); }
  if (a === "toggle"){ e.stopPropagation(); const w = t.dataset.w; if (status(w) === "known") delete P.cards[w]; else P.cards[w] = knownCard(false); await saveP(); const s = status(w); t.className = "badge " + s; t.textContent = s; const rowEl = t.closest(".lr"); if (rowEl) rowEl.className = "lr " + s; const d = document.querySelector('.detail[data-w="' + CSS.escape(w) + '"]'); if (d){ const tmp = document.createElement("div"); tmp.innerHTML = detailHTML(BY[w]); d.replaceWith(tmp.firstChild); } return; }
  if (a === "hidebanner"){ ui.banner = ""; return render(); }
  if (a === "rminbox"){ P.inbox = P.inbox.filter(x => x.word !== t.dataset.w); await saveP(); return render(); }
  if (a === "sendinbox") return sendInbox();
  if (a === "copyinbox"){ try { await navigator.clipboard.writeText(inboxText()); say("Copied."); } catch(e){ ui.shownCode = inboxText(); render(); } return; }
  if (a === "export") return exportFile();
  if (a === "importbtn") return document.getElementById("file").click();
  if (a === "copycode"){ const code = WORDS.filter(w => status(w.word) === "known").map(w => w.word).join("|"); if (!code) return say("No known words yet.", true); try { await navigator.clipboard.writeText(code); say("Copied."); } catch(e){ ui.shownCode = code; render(); } return; }
  if (a === "loadcode"){ const v = document.getElementById("paste").value; const known = [...legacyKnown(v)].filter(w => BY[w]); if (!known.length) return say("Code not recognised.", true); known.forEach(w => { if (!P.cards[w] || P.cards[w].reps === 0) P.cards[w] = knownCard(true); }); await saveP(); buildFeed(); document.getElementById("paste").value = ""; return say("Added " + known.length + " known words."); }
  if (a === "reset"){ if (!confirm("Reset ALL progress? This cannot be undone.")) return; P = emptyP(); await saveP(); buildFeed(); return say("Progress reset."); }
});

/* ================= boot ================= */
async function loadJSON(name){
  try { const r = await fetch(name, { cache: "no-cache" }); const j = await r.json(); lsSet("wsv.cache." + name, JSON.stringify(j)); return j; }
  catch(e){ try { return JSON.parse(lsGet("wsv.cache." + name) || "[]"); } catch(_){ return []; } }
}
async function boot(){
  if (window.speechSynthesis) speechSynthesis.getVoices();
  [WORDS, STORIES] = await Promise.all([loadJSON("words.json"), loadJSON("stories.json")]);
  WORDS.forEach(w => BY[w.word] = w);
  await loadP();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  const lastV = lsGet("wsv.version");
  const knownN = WORDS.filter(w => status(w.word) === "known").length;
  if (lastV && lastV !== APP_VERSION) ui.banner = "Updated to " + APP_VERSION + ". Progress kept: " + knownN + " known, " + Object.keys(P.cards).length + " cards in total.";
  lsSet("wsv.version", APP_VERSION);
  if (!ui.banner && Object.keys(P.cards).length >= 5 && Date.now() - (P.lastBackup || 0) > 30*864e5){ ui.banner = "Tip: Stats → Save backup file. Five seconds."; ui.bannerWarn = true; }
  buildFeed(); render(); prefetchImages();
}
boot();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>

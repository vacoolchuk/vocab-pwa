name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore generated audio
        uses: actions/cache@v4
        with:
          path: vocab-pwa/audio
          key: audio-${{ github.sha }}
          restore-keys: |
            audio-
      - name: Generate British neural voice audio for stories and news
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet edge-tts
          python scripts/make_audio.py
      - name: Read each news article's own preview image
        run: python scripts/news_images.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: vocab-pwa
      - id: deployment
        uses: actions/deploy-pages@v4
